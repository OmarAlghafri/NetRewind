id: reachability-lost
title: A measured path stopped answering
severity: error
confidence: 90
window: 300s
correlate_on: [subject]
root_cause: cause
advice: >-
  This is measured, not reported: the recorder sent probes and they did not come
  back. If the change named above was intended, the loss is a side effect nobody
  planned. If there is no change above it, the fault is beyond what this
  recorder can see from where it sits.
match:
  - as: cause
    kinds: [l2.arp_binding_changed, l3.default_route_changed, l3.route_removed, link.down, link.flap, policy.rule_changed]
    optional: true
    why: This is the last thing that changed before the path stopped answering.
  - as: loss
    kinds: [metric.anomaly]
    where:
      min_severity: warn
    relation: causes
    why: >-
      Probes to this address began going unanswered. Packet loss announces
      itself to nobody; it has to be measured, and it was.
  - as: recovery
    kinds: [metric.anomaly]
    optional: true
    relation: precedes
    why: It later answered again, which bounds how long the outage lasted.
i18n:
  ar:
    title: توقف مسار مقيس عن الإجابة
    advice: >-
      هذا قياس فعلي، لا تقرير: أرسل المُسجِّل مسبارات فحص (probes) ولم تعد.
      إن كان التغيير المذكور أعلاه مقصوداً، فالانقطاع أثر جانبي لم يخطط له
      أحد. وإن لم يوجد تغيير مذكور، فالعطل يقع خارج ما يستطيع هذا المُسجِّل
      رؤيته من موقعه.
    clauses:
      cause: هذا آخر شيء تغيّر قبل أن يتوقف المسار عن الإجابة.
      loss: >-
        بدأت مسبارات الفحص الموجَّهة لهذا العنوان تذهب دون إجابة. فقدان
        الحزم لا يُعلن عن نفسه لأحد؛ يجب قياسه، وقد قِيس.
      recovery: عاد للإجابة لاحقاً، ما يحدد المدة التي استغرقها الانقطاع.
