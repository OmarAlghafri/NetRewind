id: link-down-isolated-hosts
title: A link went down and took hosts with it
severity: warn
confidence: 80
window: 90s
root_cause: link
advice: >-
  The hosts did not fail. Restore the link and they will return; investigating
  them individually wastes the outage.
match:
  - as: link
    kinds: [link.down]
    why: An interface went down.
  - as: isolation
    kinds: [l2.neighbor_failed]
    min_count: 1
    relation: causes
    why: >-
      Hosts stopped answering at layer 2 immediately afterwards, which is the
      link failure showing up as apparent host failures.
i18n:
  ar:
    title: تعطّلت وصلة وسحبت معها أجهزة أخرى
    advice: >-
      الأجهزة لم تتعطّل. أعِد الوصلة وستعود من تلقاء نفسها؛ التحقيق في كل
      جهاز على حدة يُهدر وقت معالجة الانقطاع.
    clauses:
      link: توقفت واجهة شبكة عن العمل.
      isolation: >-
        توقفت أجهزة عن الإجابة على مستوى الطبقة الثانية (L2) فور ذلك، وهذا
        ظهور تعطّل الوصلة بمظهر تعطّل أجهزة.
