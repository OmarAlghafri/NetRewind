id: resolver-hijacked
title: A machine's resolver changed under it
severity: warn
confidence: 80
window: 300s
correlate_on: [subject]
root_cause: change
advice: >-
  Compare against your DHCP scope. A client that changed resolver without a
  lease renewal near it did not choose to; something told it to. Check for a
  second DHCP server and for the gateway's hardware address changing at about
  the same time.
match:
  - as: cause
    # dhcp.server_seen is deliberately absent: its subject is the server, so
    # correlate_on could never match it against a client. The segment-wide
    # story belongs to rogue-dhcp-server, which owns that chain.
    kinds: [dhcp.ack, dhcp.lease_changed, l2.arp_binding_changed, l3.default_route_changed]
    optional: true
    why: This is what changed on the path just before the resolver did.
  - as: change
    kinds: [dns.resolver_changed]
    relation: causes
    why: >-
      This machine started sending its lookups somewhere else. Every name it
      resolves from here on is answered by a different party.
  - as: fallout
    kinds: [dns.query_fail, dns.latency_spike, flow.first_failure_for_pair]
    optional: true
    relation: correlates
    why: Lookups began failing or slowing in the same window.
