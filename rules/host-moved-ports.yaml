id: host-moved-ports
title: A machine appeared behind a different interface
severity: warn
confidence: 70
window: 60s
root_cause: move
advice: >-
  Ordinary if someone re-patched a cable or a wireless client roamed. Suspicious
  if the machine is a server, or if the same hardware address appears in two
  places at once rather than moving between them.
match:
  - as: move
    kinds: [l2.mac_moved]
    why: >-
      The same hardware address is now reached through a different interface
      than before.
i18n:
  ar:
    title: ظهر جهاز خلف واجهة مختلفة
    advice: >-
      أمر عادي إذا أعاد أحدهم توصيل كبل أو تجوّل جهاز لاسلكي. لكنه مثير للشك
      إذا كان الجهاز خادماً، أو إذا ظهر عنوان العتاد نفسه في مكانين في الوقت
      نفسه بدلاً من الانتقال بينهما.
    clauses:
      move: أصبح الوصول إلى عنوان العتاد نفسه عبر واجهة مختلفة عمّا كانت عليه.
