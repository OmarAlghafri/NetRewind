[package]
name = "netrewind-desktop"
version = "1.0.0"
description = "NetRewind desktop: the network black box recorder's viewer"
authors = ["NetRewind contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/OmarAlghafri/NetRewind"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's, which
# matters on Windows (see rust-lang/cargo#8519).
name = "netrewind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
