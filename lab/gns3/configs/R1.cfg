!
! R1 - the gateway for both user VLANs, and the router NetRewind watches.
!
! Credentials here are lab throwaways on devices that exist only inside GNS3.
! Nothing in this directory has ever been near a real network.
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
enable secret 0 NetRewindLab
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
ip domain name lab.local
!
username admin privilege 15 secret 0 NetRewindLab
!
ip tcp synwait-time 5
cdp run
!
interface FastEthernet0/0
 description Core link to R2
 ip address 10.0.12.1 255.255.255.252
 ip ospf network point-to-point
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description Trunk to SW1 - carries both user VLANs
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/1.10
 description USERS gateway - this is the address NetRewind probes
 encapsulation dot1Q 10
 ip address 10.1.10.1 255.255.255.0
!
interface FastEthernet0/1.20
 description SERVERS gateway
 encapsulation dot1Q 20
 ip address 10.1.20.1 255.255.255.0
!
router ospf 1
 router-id 1.1.1.1
 network 10.0.12.0 0.0.0.3 area 0
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
line vty 0 4
 login local
 transport input ssh
!
end
