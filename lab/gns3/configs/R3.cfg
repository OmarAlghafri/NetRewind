!
! R3 - the second way into the user VLANs.
!
! It holds .2 on both VLANs rather than .1, so it is a standby path and not the
! gateway. Moving 10.1.10.1 onto R3 is what the gateway-moved scenario does, and
! it is exactly what a real failover - or a real mistake - looks like from the
! segment: the address stays, the hardware answering for it changes.
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
enable secret 0 NetRewindLab
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
ip domain name lab.local
!
username admin privilege 15 secret 0 NetRewindLab
!
ip tcp synwait-time 5
cdp run
!
interface FastEthernet0/0
 description Core link to R2
 ip address 10.0.23.2 255.255.255.252
 ip ospf network point-to-point
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description Trunk to SW2
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/1.10
 description USERS standby path
 encapsulation dot1Q 10
 ip address 10.1.10.2 255.255.255.0
!
interface FastEthernet0/1.20
 description SERVERS standby path
 encapsulation dot1Q 20
 ip address 10.1.20.2 255.255.255.0
!
router ospf 1
 router-id 3.3.3.3
 network 10.0.23.0 0.0.0.3 area 0
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
line vty 0 4
 login local
 transport input ssh
!
end
