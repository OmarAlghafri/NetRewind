!
! R2 - the middle of the routed core. Nothing is attached to it; it exists so
! that a link failure has somewhere to reconverge around.
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
enable secret 0 NetRewindLab
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
ip domain name lab.local
!
username admin privilege 15 secret 0 NetRewindLab
!
ip tcp synwait-time 5
cdp run
!
interface FastEthernet0/0
 description Core link to R1
 ip address 10.0.12.2 255.255.255.252
 ip ospf network point-to-point
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description Core link to R3
 ip address 10.0.23.1 255.255.255.252
 ip ospf network point-to-point
 duplex auto
 speed auto
!
router ospf 1
 router-id 2.2.2.2
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.23.0 0.0.0.3 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
line vty 0 4
 login local
 transport input ssh
!
end
