!
! SW1 - access switch. Real VLANs and a real dot1q trunk, which is what this
! topology has that the network-namespace lab cannot.
!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SW1
!
boot-start-marker
boot-end-marker
!
enable secret 0 NetRewindLab
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
no ip domain lookup
ip domain name lab.local
!
username admin privilege 15 secret 0 NetRewindLab
!
spanning-tree mode pvst
spanning-tree extend system-id
vtp mode transparent
!
ip tcp synwait-time 5
cdp run
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
interface FastEthernet1/0
 description Trunk to R1
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet1/1
 description Trunk to the other access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet1/2
 description NetRewind recorder - VLAN 10
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
!
interface FastEthernet1/3
 description USERS host PC1
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
!
interface Vlan10
 description In-band management
 ip address 10.1.10.10 255.255.255.0
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 10.1.10.1
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
line vty 0 4
 login local
 transport input ssh
!
end
