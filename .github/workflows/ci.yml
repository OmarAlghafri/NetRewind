name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: fmt, vet, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # Vetted for both targets. The collectors are Linux-only and have
      # non-Linux stubs precisely so the tree stays buildable off Linux; if the
      # stubs drift out of step with the real thing, this is where it shows.
      - name: vet (linux)
        run: go vet ./...
      - name: vet (windows)
        run: GOOS=windows go vet ./...
      - name: vet (darwin)
        run: GOOS=darwin go vet ./...

      - name: test
        run: go test -race ./...

      - name: build static binaries
        run: CGO_ENABLED=0 make linux

      # A recorder is only as trustworthy as what it is built from, and the web
      # interface renders strings the watched network supplies - hostnames, DNS
      # names, nftables rule text - through html/template. A stdlib escaping bug
      # is not somebody else's problem here.
      - name: known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  load:
    name: sustained write rate
    # Its own job on purpose. These measure throughput, and running them
    # alongside the rest of the suite measures how many packages were competing
    # for the runner rather than how fast the store is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: absorb a burst, fold a storm, prune a large store
        run: make load

  bpf:
    name: eBPF object matches its source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev

      # The compiled object is committed so the tree builds without a BPF
      # toolchain, and committed build output drifts from its source unless
      # something checks.
      #
      # It checks the source compiles, and that the object beside it was built
      # from this version of it. Not a byte comparison against a fresh build:
      # two clang versions emit different instructions from identical source,
      # so that only ever asked "does this runner have the same compiler",
      # which is not the question anyone needs answered.
      - name: the object matches the source, and the source compiles
        run: make bpf-check

  lab:
    name: fault injection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: kernel capabilities
        run: sudo bash lab/check-kernel.sh

      - name: install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables netcat-openbsd

      - name: build
        run: CGO_ENABLED=0 make build

      # The real gate. Builds a topology in network namespaces, records it,
      # injects fourteen faults, and asserts that every one can be found in the
      # record afterwards *and* that correlation named the cause. A green tick
      # here means the thing works, not that it compiles.
      - name: inject faults and check the record
        run: sudo BUILD=./build lab/inject.sh all

      - name: recorder log on failure
        if: failure()
        run: cat /tmp/netrewind-lab/recorder.log || true

  desktop:
    name: desktop typecheck, build, known vulnerabilities
    # The Tauri/React app has its own dependency graphs - npm for the UI,
    # Cargo for the Rust shell in desktop/src-tauri - neither of which the
    # `check` job above touches. It gets its own job for the same reason
    # `load` does: a different toolchain and a different question ("does the
    # desktop app's supply chain and types check out?") than the Go job
    # answers, not because it's slow.
    #
    # `cargo test --lib` runs the shell's unit tests; a full `tauri build`
    # (installers) is not attempted here - that is the release job's
    # business. Nothing below silently skips it - it is just not attempted.
    #
    # Deliberately left out of `release`'s `needs:`. That job ships the Go
    # binaries `make release` produces, on a tag; the desktop app isn't part
    # of that build, and a broken desktop typecheck is not a reason to hold
    # back a recorder release.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # The lockfile, exactly - not whatever `npm install` would resolve
      # today.
      - name: npm ci
        run: npm ci

      # package.json's build script is already `tsc && vite build`, so this
      # typechecks before it bundles. A separate `tsc --noEmit` step would
      # just run the first half of this command again for nothing.
      - name: typecheck and build
        run: npm run build

      # The UI's own tests (Vitest, jsdom): the data-source hook against a
      # fake recorder, the settings persistence, the capability table and
      # source banner. Fast enough to run on every push.
      - name: frontend unit tests
        run: npm test

      # The Rust shell's unit tests (bundle verification, launch options)
      # need no webview: `cargo test --lib` compiles the library only.
      # `tauri build` itself is not attempted here - it needs the WebKitGTK
      # development packages and is the release job's business.
      - name: install the shell's build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
        working-directory: .
      # tauri.conf.json names build/desktop-resources/recorder as a bundle
      # resource, and Tauri's build script refuses to compile - tests
      # included - when that path is missing. The Makefile target stages it
      # (on Linux, just a note: the recorder comes from its own package).
      - name: stage the bundle resources
        run: make desktop-resources
        working-directory: .
      - name: rust unit tests (desktop shell)
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # No --omit=dev, on purpose, for the same reason the check job's
      # govulncheck step runs unconditionally over everything: the dev
      # dependencies here (vite, tsc, the Tauri CLI) run in this job and on
      # every contributor's machine, so a vulnerability in one of them is not
      # lower-stakes than a production one. Last manual run
      # (docs/evidence/22-sbom-and-vulnerability-scan.log) found 0 either
      # way; this is what makes that true on every push instead of once.
      - name: known vulnerabilities (npm)
        run: npm audit

      # cargo-audit compiled from source (`cargo install cargo-audit
      # --locked`) took over nine minutes on comparable hardware - see the
      # same evidence log - which is too slow to pay on every push.
      # taiki-e/install-action fetches a prebuilt binary instead of compiling
      # one, which is the difference between this costing seconds and it
      # costing more than the rest of the job combined.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # desktop/src-tauri carries its own Cargo.lock, so this audits the
      # dependency tree actually resolved, not Cargo.toml's version ranges.
      # Last manual run: 0 vulnerabilities, 7 warnings, all upstream in
      # Tauri's own GTK/webview chain on Linux. cargo-audit's exit code
      # already reflects only real vulnerabilities, not warnings, so no
      # extra flags are needed to keep those from failing the build.
      - name: known vulnerabilities (cargo)
        working-directory: desktop/src-tauri
        run: cargo audit

  release:
    name: release artefacts build
    # Only on a tag. Building release tarballs on every push would be noise, and
    # a checksum file that changes on every commit is a checksum file nobody
    # checks.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, bpf, lab]
    runs-on: ubuntu-24.04
    # Read only. This job used to publish, and it must not: see below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make release VERSION=${GITHUB_REF_NAME#v}

      # Built, and deliberately not published.
      #
      # A release is cut from the machine holding the signing key, because that
      # is the only place the signature can be made - a key CI can reach is a
      # key a CI compromise can sign with, which is the whole point of having
      # one. So the release on GitHub already carries a signed SHA256SUMS by the
      # time this job runs.
      #
      # Uploading from here would overwrite it. action-gh-release replaces
      # assets of the same name, so CI's unsigned SHA256SUMS would take the
      # place of the signed one and leave SHA256SUMS.sig a signature over a file
      # that is no longer in the release. The failure that produces is the worst
      # available shape: `sha256sum -c` still passes, because CI's sums match
      # CI's tarballs, so the release looks correct to anyone checking by hand -
      # while every recorder configured with update.public_key silently refuses
      # it, and reports only that no matching asset was found.
      #
      # What this job is for is answering whether the tag builds a release at
      # all, on a runner that is not the maintainer's laptop. The artefact is
      # kept so its checksums can be compared against the published ones by
      # anyone who wants to.
      - name: keep the build, for comparison against what was published
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 14
